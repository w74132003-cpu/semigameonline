<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WaferRun 課堂版｜老師端</title>
<style>
:root{--bg:#0f1f27;--fg:#eaf1f2;--pn:#16303b;--ac:#f2b134;--mu:#9bb3ba;--ln:#2d4b58;--ok:#7fd1a0;--bad:#ff8a80}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body{padding:18px clamp(12px,3vw,40px) 60px}
h1{margin:0;font-size:26px}h1 em{font-style:normal;color:var(--ac)}h1 small{font-size:14px;color:var(--mu);font-weight:400;margin-left:10px}
h2{margin:0 0 8px;font-size:20px}
.card{background:var(--pn);border:3px solid var(--fg);box-shadow:6px 6px 0 rgba(0,0,0,.5);padding:16px 20px;margin-top:16px}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:14px}
input,select{width:100%;max-width:340px;padding:9px 10px;background:var(--bg);color:var(--fg);border:3px solid var(--ln);font:inherit;border-radius:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac)}
button{background:var(--pn);color:var(--fg);border:2px solid var(--ln);border-radius:8px;padding:9px 16px;min-height:42px;font:inherit;cursor:pointer}
button:hover{border-color:var(--fg)}
button.pri{background:var(--ac);color:#1a1200;border-color:var(--ac);font-weight:700}
button.dg{border-color:#c0392b;color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.hint{color:var(--mu);font-size:14px;margin:8px 0 0}.err{color:var(--bad);font-weight:700;min-height:22px;margin:8px 0 0}
.hide{display:none!important}
/* lobby */
.lob{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:start}
@media(max-width:820px){.lob{grid-template-columns:1fr}}
.join{text-align:center}
.codeLab{color:var(--mu);font-size:15px}
#code{font-size:clamp(64px,11vw,120px);font-weight:700;letter-spacing:.14em;color:var(--ac);line-height:1.1;padding-left:.14em}
#qr{width:min(260px,70%);margin:6px auto;background:#fff;padding:8px;line-height:0}#qr svg{width:100%;height:auto;display:block}
#url{font-size:18px;word-break:break-all;margin-top:4px}
.big{font-size:clamp(34px,6vw,60px);font-weight:700;color:var(--ac);line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--bg);border:2px solid var(--ln);padding:3px 6px 3px 12px;font-size:17px;display:flex;align-items:center;gap:6px;animation:pop .35s ease-out}
.chip.off{opacity:.45}
.chip button{min-height:0;padding:0 8px;border:0;background:none;color:var(--mu);font-size:16px}
.chip button:hover{color:var(--bad)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
/* board */
.top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.stat{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline}
.stat div{color:var(--mu);font-size:14px}.stat b{display:block;color:var(--fg);font-size:28px;line-height:1.2}
.bd{width:100%;border-collapse:collapse;margin-top:10px}
.bd th{color:var(--mu);font-weight:400;font-size:14px;text-align:left;padding:4px 8px;border-bottom:2px solid var(--ln)}
.bd td{padding:6px 8px;border-bottom:1px solid var(--ln);font-size:18px;vertical-align:middle}
.bd td.n{width:56px;font-weight:700;color:var(--ac);font-size:22px}
.bd td.s{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bd tr.off td:nth-child(2){opacity:.5}
.bar{height:14px;background:var(--bg);border:2px solid var(--ln);min-width:90px;position:relative}.bar i{display:block;height:100%;background:var(--ok);transition:width .6s}
.sm{font-size:13px;color:var(--mu)}
.tag{display:inline-block;font-size:12px;padding:0 6px;border:1px solid;margin-left:6px;vertical-align:middle}
.tag.ok{color:var(--ok)}.tag.w{color:var(--bad)}
/* podium */
.pod{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:18px 0 8px;min-height:300px}
.pd{width:min(190px,30%);text-align:center;opacity:0;transform:translateY(40px);animation:rise .7s ease-out forwards}
.pd .nm{font-size:clamp(18px,2.6vw,28px);font-weight:700;word-break:break-all}
.pd .sc{color:var(--ac);font-size:22px;font-weight:700}
.pd .blk{margin-top:6px;border:3px solid var(--fg);display:flex;align-items:flex-start;justify-content:center;font-size:44px;font-weight:700;color:#1a1200;padding-top:8px}
.pd.p1 .blk{height:170px;background:#f2b134}.pd.p2 .blk{height:120px;background:#cfd8dc}.pd.p3 .blk{height:84px;background:#d08a52}
.pd.p3{animation-delay:.3s}.pd.p2{animation-delay:1.6s}.pd.p1{animation-delay:3s}
@keyframes rise{to{opacity:1;transform:none}}
.crown{font-size:40px;line-height:1}
</style></head><body>
<h1>Wafer<em>Run</em> 課堂版<small>老師端（這個畫面可以投影給學生看）</small></h1>

<!-- 1. 設定 -->
<section id="v-setup" class="card">
  <h2>開一個房間</h2>
  <label>學生加入的時間（倒數結束後自動開始，也可以提前按開始）</label>
  <select id="joinSec"><option value="60">1 分鐘</option><option value="120" selected>2 分鐘</option><option value="180">3 分鐘</option><option value="300">5 分鐘</option><option value="600">10 分鐘</option></select>
  <label>遊戲時間上限（時間到強制結算，沒跑完的不計名次）</label>
  <select id="playMin"><option value="10">10 分鐘</option><option value="15" selected>15 分鐘</option><option value="20">20 分鐘</option><option value="30">30 分鐘</option><option value="45">45 分鐘</option><option value="0">不限時（由我按結束）</option></select>
  <div id="passBox" class="hide"><label>老師密碼（伺服器有設定 HOST_PASS）</label><input id="pass" type="password" autocomplete="off"></div>
  <div class="row"><button class="pri" id="create">開房</button></div>
  <p id="setErr" class="err"></p>
  <p class="hint">一般一場約 10–15 分鐘。學生打開網址、輸入房號和暱稱就能加入。</p>
</section>

<!-- 2. 大廳 -->
<section id="v-lobby" class="card hide">
  <div class="lob">
    <div class="join">
      <div class="codeLab">學生請打開下面的網址，輸入房號</div>
      <div id="url"></div>
      <div id="code">----</div>
      <div id="qr"></div>
      <div class="hint">手機掃描 QR code 會自動帶入房號</div>
      <div style="max-width:340px;margin:10px auto 0;text-align:left"><label style="margin:0 0 4px">學生網址（用外網／隧道時，貼上公開網址）</label><input id="pubUrl" placeholder="https://xxxx.trycloudflare.com" autocomplete="off"></div>
      <div id="lanBox" class="hide"><label style="max-width:340px;margin:10px auto 4px">網址不對？換一個網路位址</label><select id="lanSel"></select></div>
    </div>
    <div>
      <div class="top"><div><div class="sm">報名截止倒數</div><div class="big" id="joinCd">0:00</div></div>
        <div><div class="sm">已加入</div><div class="big" id="cnt">0</div></div></div>
      <div class="row"><button class="pri" id="startNow">立即開始</button><button id="extend">多等 30 秒</button></div>
      <p id="lobErr" class="err"></p>
      <div class="chips" id="chips"></div>
      <p class="hint">點暱稱旁邊的 ✕ 可以移出房間。時間到會自動開始；沒人進房的話會自動順延。</p>
    </div>
  </div>
</section>

<!-- 3. 進行中 / 結束 -->
<section id="v-game" class="hide">
  <div class="card">
    <div class="top">
      <div class="stat"><div>狀態<b id="gState">—</b></div><div>剩餘時間<b id="gLeft">—</b></div><div>完成人數<b id="gDone">0 / 0</b></div></div>
      <div class="row" style="margin:0"><button class="dg" id="endBtn">結束並公布結果</button></div>
    </div>
    <p id="allDone" class="hint hide" style="color:var(--ok);font-weight:700">🎉 所有人都完成了，可以按「結束並公布結果」。</p>
  </div>
  <div id="podium" class="card hide"><h2 style="text-align:center">🏆 今日最佳作業員</h2><div class="pod" id="pod"></div></div>
  <div class="card">
    <h2 id="boardT">即時排行</h2>
    <table class="bd"><thead id="bh"></thead><tbody id="bb"></tbody></table>
    <p class="hint" id="scoreTxt"></p>
    <div class="row hide" id="endRow"><button class="pri" id="csv">下載成績（CSV）</button><button id="again">再開一場</button></div>
  </div>
</section>

<script src="/qrcode.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')};
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let ws=null,off=0,room=null,code='',key='',info={lan:[],needPass:false,port:location.port||80},lan=0,stopRetry=false,retryT=0,lastUrl='',lastSig='',podShown=false,wantCreate=null;

function show(v){['setup','lobby','game'].forEach(x=>$('v-'+x).classList.toggle('hide',x!==v))}
const nowS=()=>Date.now()+off;

/* ---------- 連線 ---------- */
function connect(first){
  const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws=w;
  w.onopen=()=>{
    if(wantCreate){w.send(JSON.stringify(wantCreate));wantCreate=null}
    else if(code&&key)w.send(JSON.stringify({t:'host_resume',code,key}));
  };
  w.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}on(m)};
  w.onclose=()=>{if(ws!==w)return;ws=null;if(!stopRetry){clearTimeout(retryT);retryT=setTimeout(()=>connect(),1500)}};
  w.onerror=()=>{};
}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function on(m){
  if(m.t==='err'){
    if(m.code==='gone'){code='';key='';lsSet('wr_host',null);room=null;show('setup');$('setErr').textContent='之前的房間已經不存在，請重新開房';return}
    if(!room){$('setErr').textContent=m.msg;$('create').disabled=false}else $('lobErr').textContent=m.msg;
    setTimeout(()=>{$('lobErr').textContent=''},4000);return;
  }
  if(m.t==='created'){code=m.code;key=m.key;lsSet('wr_host',JSON.stringify({code,key}));return}
  if(m.t==='room'){off=m.now-Date.now();room=m;render()}
}

/* ---------- 畫面 ---------- */
function shareUrl(){
  const h=location.hostname;
  const c=($('pubUrl').value||'').trim().replace(/\/+$/,'');
  if(/^https?:\/\/[^\s]+$/i.test(c))return c;
  let base=location.origin;
  if(info.publicUrl&&(h==='localhost'||h==='127.0.0.1'||h==='[::1]'))base=info.publicUrl;
  else if(h==='localhost'||h==='127.0.0.1'||h==='[::1]'){base=info.lan[lan]?info.lan[lan].url:location.origin}
  return base;
}
function drawQR(url){
  if(url===lastUrl)return;lastUrl=url;
  try{const q=qrcode(0,'M');q.addData(url);q.make();const n=q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+' '+r+'h1v1h-1z';
    $('qr').innerHTML='<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges"><path d="'+d+'" fill="#000"/></svg>';
  }catch(e){$('qr').textContent=''}
}
function render(){
  if(!room)return;
  $('scoreTxt').textContent=room.scoreText||'';
  if(room.phase==='lobby'){show('lobby');renderLobby()}
  else{show('game');renderGame()}
}
function renderLobby(){
  const base=shareUrl(),u=base+'/?room='+room.code;
  $('code').textContent=room.code;$('url').textContent=base.replace(/^https?:\/\//,'');
  drawQR(u);
  $('cnt').textContent=room.players.length;
  $('startNow').disabled=!room.players.length;
  const sig=room.players.map(p=>p.name+p.on).join('|');
  if(sig!==lastSig){lastSig=sig;
    $('chips').innerHTML=room.players.map(p=>'<span class="chip'+(p.on?'':' off')+'">'+esc(p.name)+'<button title="移出房間" data-k="'+esc(p.name)+'">✕</button></span>').join('')}
  updTimers();
}
function updTimers(){
  if(!room)return;
  if(room.phase==='lobby')$('joinCd').textContent=mmss(room.joinEnd-nowS());
  else if(room.phase==='playing'){
    const d=room.startAt-nowS();
    if(d>0){$('gState').textContent='倒數 '+Math.ceil(d/1000);$('gLeft').textContent=room.playMin?room.playMin+':00':'不限時'}
    else{$('gState').textContent='進行中';$('gLeft').textContent=room.playEnd?mmss(room.playEnd-nowS()):'不限時'}
  }
}
setInterval(updTimers,250);

function renderGame(){
  const ps=room.players,done=ps.filter(p=>p.done).length,ended=room.phase==='ended';
  $('gDone').textContent=done+' / '+ps.length;
  $('endBtn').classList.toggle('hide',ended);
  $('allDone').classList.toggle('hide',ended||!(ps.length&&done===ps.length));
  $('endRow').classList.toggle('hide',!ended);
  $('boardT').textContent=ended?'完整成績':'即時排行';
  if(ended){$('gState').textContent='已結束';$('gLeft').textContent='—'}
  $('bh').innerHTML=ended
    ?'<tr><th>名次</th><th>暱稱</th><th>良率</th><th>用時</th><th>摔晶圓</th><th>被罵</th><th style="text-align:right">分數</th></tr>'
    :'<tr><th>名次</th><th>暱稱</th><th>進度</th><th style="text-align:right">狀態</th></tr>';
  $('bb').innerHTML=ps.map((p,i)=>{
    const rk=p.done?p.rank:'—',nm=esc(p.name)+(p.sus?'<span class="tag w" title="45 秒內就完成，可能有作弊">⚠ 太快</span>':'')+(p.on?'':'<span class="tag" style="color:var(--mu)">離線</span>');
    if(ended){
      const t=p.done?Math.floor(p.h/60)+'時'+String(Math.round(p.h%60)).padStart(2,'0')+'分':'—';
      return '<tr class="'+(p.on?'':'off')+'"><td class="n">'+rk+'</td><td>'+nm+'</td><td>'+(p.done?p.y+'%':'—')+'</td><td>'+t+'</td><td>'+(p.done?p.drops:'—')+'</td><td>'+(p.done?p.scold:'—')+'</td><td class="s">'+(p.done?p.score:'未完成（'+p.step+'/7）')+'</td></tr>';
    }
    return '<tr class="'+(p.on?'':'off')+'"><td class="n">'+rk+'</td><td>'+nm+'</td><td><div class="bar"><i style="width:'+Math.round(p.step/7*100)+'%"></i></div><span class="sm">第 '+p.step+' / 7 站・目前良率 '+p.avg+'%</span></td><td class="s">'+(p.done?'✅ '+p.score+' 分':'進行中')+'</td></tr>';
  }).join('');
  if(ended&&!podShown){podShown=true;renderPodium(ps)}
  $('podium').classList.toggle('hide',!ended);
}
function renderPodium(ps){
  const t=ps.filter(p=>p.done).slice(0,3);
  if(!t.length){$('pod').innerHTML='<p class="hint">沒有人完成，下次再接再厲。</p>';return}
  const order=[t[1],t[0],t[2]].filter(Boolean);
  $('pod').innerHTML=order.map(p=>{const r=p.rank;return '<div class="pd p'+r+'">'+(r===1?'<div class="crown">👑</div>':'')+'<div class="nm">'+esc(p.name)+'</div><div class="sc">'+p.score+' 分</div><div class="blk">'+r+'</div></div>'}).join('');
}

/* ---------- 按鈕 ---------- */
$('create').onclick=()=>{
  $('setErr').textContent='';$('create').disabled=true;
  wantCreate={t:'host_create',joinSec:+$('joinSec').value,playMin:+$('playMin').value,pass:$('pass').value};
  podShown=false;lastSig='';lastUrl='';
  if(ws&&ws.readyState===1){ws.send(JSON.stringify(wantCreate));wantCreate=null}else if(!ws)connect();
  setTimeout(()=>{$('create').disabled=false},3000);
};
$('startNow').onclick=()=>send({t:'host_start'});
$('extend').onclick=()=>send({t:'host_extend'});
$('endBtn').onclick=()=>{if(confirm('現在結束？還沒跑完的同學不計名次。'))send({t:'host_end'})};
$('chips').onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&confirm('把「'+k+'」移出房間？'))send({t:'host_kick',name:k})};
$('pubUrl').oninput=()=>{lsSet('wr_pub',$('pubUrl').value.trim());lastUrl='';render()};
$('lanSel').onchange=()=>{lan=+$('lanSel').value;lastUrl='';render()};
$('again').onclick=()=>{lsSet('wr_host',null);code='';key='';stopRetry=true;try{ws&&ws.close()}catch(e){}location.reload()};
$('csv').onclick=()=>{
  if(!room)return;
  const q=s=>{s=String(s);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  const rows=[['名次','暱稱','分數','良率%','用時（分）','摔晶圓','被罵','完成站數','備註']];
  room.players.forEach(p=>rows.push([p.done?p.rank:'',p.name,p.done?p.score:'',p.done?p.y:'',p.done?p.h:'',p.done?p.drops:'',p.done?p.scold:'',p.step,p.sus?'完成太快，請確認':(p.done?'':'未完成')]));
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='WaferRun-'+room.code+'-成績.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

/* ---------- 啟動 ---------- */
(async()=>{
  try{const r=await fetch('/info',{cache:'no-store'});info=await r.json()}catch(e){}
  $('pubUrl').value=lsGet('wr_pub');
  $('passBox').classList.toggle('hide',!info.needPass);
  const h=location.hostname,isLocal=h==='localhost'||h==='127.0.0.1'||h==='[::1]';
  if(isLocal&&info.lan&&info.lan.length>1){$('lanBox').classList.remove('hide');$('lanSel').innerHTML=info.lan.map((x,i)=>'<option value="'+i+'">'+esc(x.url)+'（'+esc(x.name)+'）</option>').join('')}
  if(isLocal&&(!info.lan||!info.lan.length))$('setErr').textContent='沒偵測到區域網路位址：學生可能連不進來，請先確認這台電腦已連上 Wi-Fi。';
  try{const s=JSON.parse(lsGet('wr_host')||'null');if(s&&s.code&&s.key){code=s.code;key=s.key;connect(true)}}catch(e){}
})();
</script>
</body></html>
